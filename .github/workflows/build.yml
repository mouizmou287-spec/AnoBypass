name: Build Zygisk Module

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Build Module
      run: |
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ -shared -fPIC -o libAnoBypass.so jni/main.cpp
        
    - name: Prepare ZIP
      run: |
        mkdir -p module/zygisk
        cp libAnoBypass.so module/zygisk/arm64-v8a.so
        cd module
        zip -r ../AnoBypass.zip .
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnoBypass-Module
        path: AnoBypass.zip
